[project]
name = "ai-service"
version = "0.1.0"
description = "NexusRAG AI service: code parsing, chunking, embeddings and retrieval"
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.35",
    "elasticsearch>=8.15.0",
    "fastapi>=0.115",
    "neo4j>=5.27.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "tiktoken>=0.8",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
ai-service = "ai_service.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
